<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8"   >
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0"   >
        <title>Image Resizer Service</title>
        <style>
            *{

                margin: 0;
                    padding: 0;
                    box-sizing: border-box;
            }
          
body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .upload-area {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }

    .upload-area:hover {
      background: #f5f7ff;
      border-color: #764ba2;
    }

    .upload-area.dragover {
      background: #f0f4ff;
      border-color: #764ba2;
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .upload-text {
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .upload-subtext {
      color: #999;
      font-size: 12px;
    }

    input[type="file"] {
      display: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e0e0e0;
    }

    .preview-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .preview-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .preview-images {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .preview-item {
      flex: 1;
      min-width: 150px;
    }

    .preview-item img {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #eee;
      margin-bottom: 10px;
    }

    .preview-item-title {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .preview-item-size {
      font-size: 11px;
      color: #999;
      margin-bottom: 8px;
    }

    .download-btn {
      width: 100%;
      padding: 8px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .download-btn:hover {
      background: #764ba2;
    }

    .message {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .grid-controls {
      margin-top: 20px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 6px;
    }

    .grid-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }

    .grid-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    </style
    </head>
    <body>
        <body>
  <div class="container">
    <h1> Passport Photo Generator</h1>
    <p class="subtitle">Upload your photo and generate professional passport photos</p>

    <div id="message" class="message" style="display: none;"></div>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon"></div>
      <div class="upload-text">Choose an image or drag it here</div>
      <div class="upload-subtext">Supported formats: JPEG, PNG (Max 5MB)</div>
      <input type="file" id="fileInput" accept="image">
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Processing your image...</p>
    </div>

    <div class="preview-section" id="previewSection" style="display: none;">
      <div class="preview-title">Your Passport Photos</div>
      <div class="preview-images">
        <div class="preview-item" id="processedPreview" style="display: none;">
          <div class="preview-item-title">Processed Photo</div>
          <img id="processedImg" alt="Processed">
          <div class="preview-item-size" id="processedSize"></div>
          <button class="download-btn" id="downloadProcessed">Download</button>
        </div>

        <div class="preview-item" id="gridPreview" style="display: none;">
          <div class="preview-item-title">4x Photo Grid</div>
          <img id="gridImg" alt="Grid">
          <div class="preview-item-size" id="gridSize"></div>
          <button class="download-btn" id="downloadGrid">Download</button>
        </div>
      </div>

      <div class="grid-controls">
        <div class="grid-label">Generate additional grid copies</div>
        <input type="number" class="grid-input" id="copiesInput" min="4" max="20" value="4" step="2" placeholder="Number of copies">
        <button class="btn-primary" id="generateGridBtn">Generate Custom Grid</button>
      </div>
    </div>

    <div class="button-group" id="buttonGroup" style="display: none;">
      <button class="btn-secondary" id="resetBtn">Reset</button>
    </div>
  </div>

    
 <script>
   const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const messageDiv = document.getElementById('message');
    const loading = document.getElementById('loading');
    const previewSection = document.getElementById('previewSection');
    const buttonGroup = document.getElementById('buttonGroup');

    let uploadedFile = null;
    let processedImagePath = null;

    // File upload handling
    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        handleFileSelect();
      }
    });

    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
      const file = fileInput.files[0];
      if (!file) return;

      uploadedFile = file;
      uploadImage(file);
    }

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
    }

    function hideMessage() {
      messageDiv.style.display = 'none';
    }

    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('file', file);

      loading.style.display = 'block';
      hideMessage();

      try {
        const response = await fetch('/api/photos/upload', {
          method: 'POST',
          body: formData
        });

        const text = await response.text();
        console.log(text);

        const data = JSON.parse(text);

        if (!response.ok) {
          throw new Error(data.message || 'Upload failed');
        }

        processedImagePath = data.data.processed.downloadUrl;

        // Show processed image
        document.getElementById('processedImg').src = processedImagePath;
        document.getElementById('processedSize').textContent = 
          `${data.data.processed.dimensions.width}x${data.data.processed.dimensions.height}px`;
        document.getElementById('processedPreview').style.display = 'block';

        // Generate initial grid
        await generateGrid(4);

        previewSection.style.display = 'block';
        buttonGroup.style.display = 'flex';
        uploadArea.style.display = 'none';
        showMessage('✅ Photo processed successfully!', 'success');

      } catch (error) {
        showMessage(`❌ ${error.message}`, 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    async function generateGrid(copies) {
      loading.style.display = 'block';

      try {
        const response = await fetch('/api/photos/output', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            imagePath: processedImagePath,
            copies
          })
        });

        const text = await response.text();
        console.log(text);
        const data = JSON.parse(text);

        if (!response.ok) {
          throw new Error(data.message || 'Grid generation failed');
        }

        document.getElementById('gridImg').src = data.data.grid.downloadUrl;
        document.getElementById('gridSize').textContent = 
          `${data.data.grid.dimensions.width}x${data.data.grid.dimensions.height}px (${copies} photos)`;
        document.getElementById('gridPreview').style.display = 'block';

        showMessage(`✅ Grid with ${copies} photos generated!`, 'success');

      } catch (error) {
        showMessage(`❌ ${error.message}`, 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    document.getElementById('downloadProcessed').addEventListener('click', () => {
      downloadFile(processedImagePath, 'passport-photo.jpg');
    });

    document.getElementById('downloadGrid').addEventListener('click', () => {
      const gridImg = document.getElementById('gridImg');
      downloadFile(gridImg.src, 'passport-photo-grid.jpg');
    });

    document.getElementById('generateGridBtn').addEventListener('click', () => {
      const copies = parseInt(document.getElementById('copiesInput').value);
      if (copies < 4 || copies > 20) {
        showMessage('Please enter a number between 4 and 20', 'error');
        return;
      }
      generateGrid(copies);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      location.reload();
    });

    function downloadFile(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }


</script>


</body> 

</html>
